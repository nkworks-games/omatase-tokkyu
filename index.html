<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>お待たせ特急</title>
<meta name="description" content="回転寿司の特急レーンを走る列車になって、注文の席の前でピタッと止まれ。急ブレーキはネタが飛ぶ！ 60秒で何皿届けられるかを競う3Dゲーム。">
<meta name="theme-color" content="#16100c">
<meta property="og:type" content="website">
<meta property="og:title" content="お待たせ特急">
<meta property="og:description" content="寿司をのせた特急を、注文の席の前でピタッと止めろ。急ブレーキはネタが飛ぶ！ 60秒で何皿届けられる？">
<meta property="og:url" content="https://nkworks-games.com/omatase-tokkyu/">
<meta property="og:image" content="https://nkworks-games.com/omatase-tokkyu/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a20'/%3E%3Cellipse cx='32' cy='46' rx='24' ry='7' fill='%23f0c04a'/%3E%3Crect x='14' y='30' width='36' height='15' rx='7' fill='%23fffdf4'/%3E%3Cpath d='M9 33c1-11 9-14 15-14h16c6 0 14 3 15 14-5 2-8-1-10-4H19c-2 3-5 6-10 4z' fill='%23e2472c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#1c1a20; --shu:#e2472c; --shuD:#a8301f; --gold:#f0c04a; --cream:#f7ecd8; --wood:#5a3a22; --green:#49d27c; --blue:#21c7ff; --page:#16100c;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --maru:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --ad-h:50px;      /* 広告バナーの高さ（スマホ） */
  --ad-gap:60px;    /* バナーとゲームの間の余白。画面の大きさに合わせて、スクリプト（adLayout）が 60〜150px の間で決め直す */
}
@media (orientation: landscape) and (min-width: 728px) and (min-height: 500px){:root{--ad-h:90px}}   /* 横長の画面（パソコンなど）ではバナーを90pxに */
html,body{margin:0;height:100%;background:var(--page);color:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* ゲームの場所：ノッチより下・バナーと余白より上。その中に、縦長のゲーム画面（#stage）をまん中に置く */
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--ad-h) + env(safe-area-inset-bottom,0px) + var(--ad-gap));display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#f4dfc0;touch-action:none;outline:none;contain:strict;width:360px;height:480px}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;left:0;top:0;width:360px;height:480px;transform-origin:0 0;font-family:var(--maru);font-weight:800;pointer-events:none}
#ui button,#ui a{pointer-events:auto;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.hide{display:none!important}
.ov{position:absolute;left:0;top:0;right:0;bottom:0}
/* ▼広告バナーの場所（ゲームとは別の、いちばん下の帯） */
#ad-zone{position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--ad-h);padding-bottom:env(safe-area-inset-bottom,0px);background:#100b08;box-shadow:0 -1px 0 rgba(240,192,74,.16)}
#ad-banner{width:100%;height:var(--ad-h);overflow:hidden;display:flex;align-items:center;justify-content:center}

/* ---------- 走っている間の表示 ---------- */
.chip{position:absolute;box-sizing:border-box;background:rgba(28,26,32,.86);border:1px solid rgba(240,192,74,.6);border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.28);contain:layout paint}
#tm{left:10px;top:10px;width:92px;height:40px}
#tm small{position:absolute;left:9px;top:7px;font-size:9.5px;line-height:1;color:var(--gold);letter-spacing:.04em}
#tm i{position:absolute;left:9px;bottom:7px;font-style:normal;font-size:9.5px;line-height:1;color:#d9cfc0}
#tmv{position:absolute;right:9px;top:0;height:40px;line-height:39px;font-family:var(--pop);font-weight:400;font-size:27px;font-variant-numeric:tabular-nums}
#tm.low{border-color:#ff6a4d;background:rgba(150,28,16,.9);animation:lowp 1s ease-in-out infinite}
#tm.last #tmv{left:0;right:0;text-align:center;font-size:19px;color:#ffe27a}#tm.last small,#tm.last i{display:none}
@keyframes lowp{0%{transform:scale(1.09)}30%{transform:scale(1)}}
#sc{left:110px;top:10px;width:124px;height:40px;text-align:center;line-height:38px}
#scv{font-family:var(--pop);font-weight:400;font-size:23px;font-variant-numeric:tabular-nums}
#sc small,#pl small{font-size:11px;margin-left:2px;color:var(--gold)}
#pl{left:242px;top:10px;width:66px;height:40px;text-align:center;line-height:38px}
#plv{font-family:var(--pop);font-weight:400;font-size:23px;font-variant-numeric:tabular-nums}
#sc.bump #scv,#pl.bump #plv{display:inline-block;animation:bump .28s ease-out}
@keyframes bump{0%{transform:scale(1.45)}100%{transform:scale(1)}}
#mute{position:absolute;right:10px;top:10px;width:36px;height:40px;padding:0;border-radius:12px;border:1px solid rgba(240,192,74,.6);background:rgba(28,26,32,.86);color:#fff;font-size:17px;line-height:38px;box-shadow:0 2px 0 rgba(0,0,0,.28)}
#mute:after{content:"";position:absolute;left:-6px;right:-6px;top:-8px;bottom:-8px}      /* 押せる範囲を少し広く */
#mute.off{color:rgba(255,255,255,.35)}#mute.off:before{content:"";position:absolute;left:7px;right:7px;top:19px;height:2px;background:#ff6a4d;transform:rotate(-38deg);border-radius:1px}
/* 注文の札（どの席へ・何を・あと何m） */
#od{left:10px;top:56px;width:340px;height:50px}
#odi{position:absolute;left:4px;top:1px;width:62px;height:47px}
#od .o1{position:absolute;left:72px;top:4px;font-size:12px;line-height:22px;white-space:nowrap}
#odn{display:inline-block;min-width:30px;height:22px;margin-right:4px;padding:0 3px;box-sizing:border-box;border-radius:5px;background:#fff6d8;border:2px solid var(--shu);color:var(--shu);font-family:var(--pop);font-weight:400;font-size:16px;line-height:18px;text-align:center;vertical-align:top}
#od .o2{position:absolute;left:72px;top:28px;font-size:13px;line-height:17px;white-space:nowrap}
#odp{margin-left:5px;font-size:11px;color:var(--gold)}
#od .o3{margin-left:9px;font-size:9.5px;color:#d9cfc0}
#odg{font-style:normal;font-size:10px;letter-spacing:1px;margin-left:3px;color:#ff8a5c}
#od.new{animation:odin .34s cubic-bezier(.2,1.5,.5,1)}
@keyframes odin{0%{transform:translateX(-30px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
#dist{position:absolute;right:10px;top:1px;height:28px;line-height:28px;white-space:nowrap;text-align:right}
#dist small{font-size:11px;color:var(--gold);margin-right:3px}
#dist b{font-family:var(--pop);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
#dist i{font-style:normal;font-size:12px;margin-left:2px}
#dist.near b{color:#a8ffc4}
#dist.off{visibility:hidden}
/* 止まる位置のものさし（絵として描く）。青い印＝いま指を離すと止まる所 */
#tape{position:absolute;left:12px;top:112px;width:336px;height:34px}
/* れんぞくの倍率（点数の右上に、小さな札でつく。次の皿が何倍になるか） */
#cmb{position:absolute;left:213px;top:2px;height:18px;min-width:42px;padding:0 6px;box-sizing:border-box;border-radius:9px;background:var(--shu);border:1px solid #ffd9a0;font-family:var(--pop);font-weight:400;font-size:11.5px;line-height:16px;text-align:center;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);z-index:2}
#cmb.pop{animation:bump .3s ease-out}
/* まん中のお知らせ（ピッタリ！ など） */
#msg{position:absolute;left:0;right:0;top:39%;text-align:center;opacity:0;font-family:var(--pop);font-weight:400;text-shadow:0 3px 0 rgba(0,0,0,.55),-2px 0 0 #2a1c14,2px 0 0 #2a1c14,0 -2px 0 #2a1c14,0 2px 0 #2a1c14,-2px -2px 0 #2a1c14,2px -2px 0 #2a1c14,-2px 2px 0 #2a1c14,2px 2px 0 #2a1c14}
#msg .t{display:block;font-size:40px;line-height:1.15;letter-spacing:.02em}
#msg .p{display:block;font-size:30px;line-height:1.15;color:#fff}
#msg .s{display:block;margin-top:3px;font-size:15px;line-height:1.3;color:#ffe27a}
#msg.perfect .t{color:#ffe14a}#msg.good .t{color:#8cf5a8}#msg.ok .t{color:#fff}#msg.bad .t{color:#ff8d78;font-size:33px}#msg.info .t{color:#fff;font-size:33px}#msg.end .t{font-size:40px;color:#fff}
#msg.go{animation:msg 1.15s ease-out forwards}#msg.stay{animation:msgin .3s cubic-bezier(.2,1.5,.5,1) forwards}
@keyframes msg{0%{opacity:0;transform:scale(1.6)}13%{opacity:1;transform:scale(1)}72%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-26px)}}
@keyframes msgin{0%{opacity:0;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
/* ヒント（ものさしのすぐ下。指でかくれない場所） */
#hint{position:absolute;left:0;right:0;top:151px;text-align:center;font-size:14.5px;line-height:1.3;white-space:nowrap;opacity:0;transition:opacity .15s;text-shadow:0 2px 0 rgba(0,0,0,.5),-1.5px 0 0 #2a1c14,1.5px 0 0 #2a1c14,0 -1.5px 0 #2a1c14,0 1.5px 0 #2a1c14,-1px -1px 0 #2a1c14,1px -1px 0 #2a1c14,-1px 1px 0 #2a1c14,1px 1px 0 #2a1c14}
#hint.on{opacity:1}#hint.warn{color:#ffe14a;font-size:16.5px;animation:hw .26s ease-in-out infinite alternate}#hint.go{color:#a8ffc4;font-size:17px}
@keyframes hw{to{transform:scale(1.07)}}
/* 速さ・ブレーキ・ネタのずれ（下のパネル。絵として描く） */
#pan{position:absolute;left:12px;bottom:10px;width:336px;height:62px}
/* カウントダウン */
#cnt{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--pop);font-weight:400;font-size:92px;line-height:1;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.5),-3px 0 0 var(--shuD),3px 0 0 var(--shuD),0 -3px 0 var(--shuD),0 3px 0 var(--shuD),-2px -2px 0 var(--shuD),2px -2px 0 var(--shuD),-2px 2px 0 var(--shuD),2px 2px 0 var(--shuD)}
#cnt.pop{animation:cnt .5s ease-out}
@keyframes cnt{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:.9}}

/* ---------- タイトル ---------- */
#title{background:linear-gradient(to bottom,rgba(22,14,10,.5) 0,rgba(22,14,10,0) 34%,rgba(22,14,10,0) 46%,rgba(22,14,10,.72) 74%,rgba(22,14,10,.86) 100%)}
#logo{position:absolute;left:0;right:16px;top:58px;margin:0;text-align:center;font-family:var(--pop);font-weight:400;line-height:1;white-space:nowrap;transform:rotate(-3deg)}
#logo .la{display:inline-block;font-size:37px;color:#fff;text-shadow:-2.5px 0 0 #2a1c14,2.5px 0 0 #2a1c14,0 -2.5px 0 #2a1c14,0 2.5px 0 #2a1c14,-2px -2px 0 #2a1c14,2px -2px 0 #2a1c14,-2px 2px 0 #2a1c14,2px 2px 0 #2a1c14,0 6px 0 #2a1c14,2px 6px 0 #2a1c14,-2px 6px 0 #2a1c14}
#logo .lb{display:inline-block;margin-left:4px;font-size:60px;color:var(--shu);vertical-align:-8px;text-shadow:-3px 0 0 #fff,3px 0 0 #fff,0 -3px 0 #fff,0 3px 0 #fff,-2.2px -2.2px 0 #fff,2.2px -2.2px 0 #fff,-2.2px 2.2px 0 #fff,2.2px 2.2px 0 #fff,0 8px 0 #2a1c14,3px 8px 0 #2a1c14,-3px 8px 0 #2a1c14,3px 5px 0 #2a1c14,-3px 5px 0 #2a1c14}
#lead{position:absolute;left:0;right:0;top:127px;margin:0;text-align:center}
#lead span{display:inline-block;padding:4px 14px 5px;border-radius:13px;background:var(--ink);border:1px solid var(--gold);color:var(--gold);font-size:12.5px;line-height:1.2;letter-spacing:.05em}
#how{position:absolute;left:16px;right:16px;bottom:110px;padding:9px 12px 8px;background:rgba(28,26,32,.88);border:1px solid rgba(240,192,74,.6);border-radius:13px;font-size:13px;line-height:1.45}
#how p{margin:0 0 5px;padding-left:26px;position:relative}#how p:last-child{margin:0}
#how i{position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;background:var(--shu);font-style:normal;font-family:var(--pop);font-weight:400;font-size:11px;line-height:19px;text-align:center}
#how b{color:var(--gold);font-weight:800}
#how small{display:block;font-size:11px;line-height:1.35;color:#e6dccb}
#how em{font-style:normal;color:#a8ffc4}
.pc .t,.k{display:none}.pc .k{display:inline}
#best0{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:12px;line-height:1;color:var(--gold);text-shadow:0 1px 2px #000}
#go{position:absolute;left:50%;bottom:28px;width:212px;height:54px;margin-left:-106px;padding:0 0 4px;border-radius:27px;border:2px solid #fff;background:linear-gradient(to bottom,#f2573a,#d3381f);color:#fff;font-family:var(--pop);font-weight:400;font-size:25px;letter-spacing:.08em;box-shadow:0 5px 0 #7c1f12,0 9px 14px rgba(0,0,0,.4);animation:gob 1.3s ease-in-out infinite}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #7c1f12;animation:none}
@keyframes gob{50%{transform:scale(1.04)}}
.cr{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:9.5px;line-height:1;color:rgba(255,255,255,.6);letter-spacing:.14em}

/* ---------- 結果（伝票） ---------- */
#res{background:rgba(22,14,10,.6)}
#rcard{position:absolute;left:50%;top:50%;width:292px;margin-left:-146px;box-sizing:border-box;padding:13px 16px 13px;background:var(--cream);color:#3a2618;border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 14px 26px rgba(0,0,0,.45);text-align:center;transform:translateY(-58%) rotate(-1.2deg)}
#rcard:before,#rcard:after{content:"";position:absolute;left:0;right:0;height:6px;background:radial-gradient(circle at 6px 0,transparent 4px,var(--cream) 4.5px) -6px 0/12px 6px repeat-x}
#rcard:before{top:-5px;transform:scaleY(-1)}#rcard:after{bottom:-5px}
#res.in #rcard{animation:rin .42s cubic-bezier(.2,1.3,.4,1)}
@keyframes rin{0%{transform:translateY(-20%) rotate(4deg) scale(.8);opacity:0}100%{transform:translateY(-58%) rotate(-1.2deg);opacity:1}}
#rcard .h{font-size:11px;line-height:1;letter-spacing:.3em;color:#8a6a4c;padding-left:.3em}
#rcard .l{margin:7px 0 0;font-size:14px;line-height:1}
#rcard .m{margin:3px 0 0;font-size:16px;line-height:1.1;white-space:nowrap}
#rcard .m b{font-family:var(--pop);font-weight:400;font-size:39px;color:var(--shu);margin:0 2px;font-variant-numeric:tabular-nums}
#rcard .m i{font-style:normal;margin:0 3px;color:#b99c7c}
#rcard hr{border:0;border-top:2px dashed #cdb596;margin:9px 0 8px}
#rk{display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1.2}#rk span:first-child{margin-right:9px}
#rkv{display:inline-block;min-width:108px;padding:5px 12px 6px;border-radius:7px;border:2px solid #3a2618;font-family:var(--pop);font-weight:400;font-size:23px;line-height:1.1;letter-spacing:.14em;text-indent:.14em;color:#fff;background:#6b7280;box-shadow:0 3px 0 rgba(58,38,24,.35)}
#rkv.r1{background:#4f7fb8}#rkv.r2{background:#2f8fd0}#rkv.r3{background:#2f9e58}#rkv.r4{background:#d9402a}#rkv.r5{background:linear-gradient(105deg,#b9860f,#f3cf52 45%,#fff3b4 55%,#d9a520);color:#4a2c08;border-color:#4a2c08}
#rn{margin-top:6px;font-size:11px;line-height:1.2;color:#8a6a4c;min-height:13px}
#rn b{color:var(--shu)}
#rst{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 6px;font-size:10.5px;line-height:1.15}
#rst span{display:block;padding:4px 0 5px;border-radius:6px;background:rgba(134,84,46,.12)}
#rst b{display:block;margin-top:2px;font-family:var(--pop);font-weight:400;font-size:17px;line-height:1;color:#3a2618}
#rst .bad b{color:#b0432f}
#rb{margin-top:8px;font-size:11.5px;line-height:1.2;color:#8a6a4c}
#rb b{color:var(--shu)}
#nb{position:absolute;right:-10px;top:-13px;padding:5px 10px 6px;border-radius:14px;background:var(--shu);border:2px solid #fff;color:#fff;font-size:11.5px;line-height:1;transform:rotate(9deg);box-shadow:0 3px 0 rgba(0,0,0,.25);animation:gob .7s ease-in-out infinite}
#btns{position:absolute;left:0;right:0;bottom:52px;display:flex;justify-content:center;opacity:.5;pointer-events:none}
#btns.live{opacity:1;pointer-events:auto}
#btns:not(.live) .btn{pointer-events:none!important}
.btn{display:block;box-sizing:border-box;width:150px;height:48px;margin:0 5px;padding:0 0 3px;border-radius:24px;border:2px solid #fff;color:#fff;font-family:var(--pop);font-weight:400;font-size:17px;line-height:42px;text-align:center;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.45)}
#retry{background:linear-gradient(to bottom,#f2573a,#d3381f)}
#share{background:#17151a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
#home{position:absolute;left:50%;bottom:7px;width:144px;height:40px;margin-left:-72px;padding:0;border:0;background:none;color:#fff;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-shadow:0 1px 2px #000}
#load{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;background:var(--page);color:var(--gold);font-size:14px;letter-spacing:.1em}
</style>
</head>
<body>
<div id="app">
  <div id="stage" tabindex="-1">
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="hud" class="hide">
        <div id="tm" class="chip"><small>のこり</small><i>秒</i><b id="tmv">60</b></div>
        <div id="sc" class="chip"><b id="scv">0</b><small>点</small></div>
        <div id="pl" class="chip"><b id="plv">0</b><small>皿</small></div>
        <div id="od" class="chip">
          <canvas id="odi" width="198" height="150"></canvas>
          <div class="o1"><b id="odn">10</b>番テーブルへ</div>
          <div class="o2"><span id="odk">まぐろ</span><span id="odp">120点</span><span class="o3">すべりやすさ<i id="odg">●●○○</i></span></div>
          <div id="dist"><small>あと</small><b id="dv">0</b><i>m</i></div>
        </div>
        <canvas id="tape"></canvas>
        <div id="cmb" class="hide"></div>
        <div id="hint"></div>
        <canvas id="pan"></canvas>
      </div>
      <div id="msg"></div>
      <div id="cnt" class="hide"></div>
      <div id="title" class="ov hide">
        <h1 id="logo"><span class="la">お待たせ</span><span class="lb">特急</span></h1>
        <p id="lead"><span>すしを ピタッと届ける 60秒</span></p>
        <div id="how">
          <p><i>1</i><span class="t">画面を<b>長押しで加速</b>、<b>はなすとブレーキ</b></span><span class="k"><b>クリック長押し</b>（スペースキーでも）で<b>加速</b>、<b>はなすとブレーキ</b></span></p>
          <p><i>2</i>注文の席の<em>みどりの帯</em>で、<b>ピタッと止まる</b></p>
